<text x="783.0" y="524.5" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">tile 1</text>
<text x="783.0" y="549.5" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">128 тактов</text>
<rect x="865.0" y="495" width="76.0" height="72" rx="10" fill="#fff3dc" stroke="#7d94aa" stroke-width="1.6"/>
<text x="903.0" y="524.5" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#152d46" text-anchor="middle">wait</text>
<text x="903.0" y="549.5" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#152d46" text-anchor="middle">64</text>
<rect x="945.0" y="495" width="156.0" height="72" rx="10" fill="#e4f3ee" stroke="#7d94aa" stroke-width="1.6"/>
<text x="1023.0" y="524.5" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">tile 2</text>
<text x="1023.0" y="549.5" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">128 тактов</text>
<rect x="1105.0" y="495" width="76.0" height="72" rx="10" fill="#fff3dc" stroke="#7d94aa" stroke-width="1.6"/>
