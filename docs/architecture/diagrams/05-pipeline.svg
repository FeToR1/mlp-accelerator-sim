<text x="823.0" y="444.5" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">буфер A</text>
<rect x="945.0" y="390" width="236.0" height="72" rx="10" fill="#eef5fc" stroke="#7d94aa" stroke-width="1.6"/>
<text x="1063.0" y="419.5" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">load tile 3</text>
<text x="1063.0" y="444.5" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">буфер B</text>
<rect x="465.0" y="495" width="156.0" height="72" rx="10" fill="#e4f3ee" stroke="#7d94aa" stroke-width="1.6"/>
<text x="543.0" y="524.5" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">tile 0</text>
<text x="543.0" y="549.5" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">128 тактов</text>
<rect x="625.0" y="495" width="76.0" height="72" rx="10" fill="#fff3dc" stroke="#7d94aa" stroke-width="1.6"/>
<text x="663.0" y="524.5" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#152d46" text-anchor="middle">wait</text>
<text x="663.0" y="549.5" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#152d46" text-anchor="middle">64</text>
