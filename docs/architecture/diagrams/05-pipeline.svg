<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img">
<title>Перекрытие DMA и вычислений</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#42566d"/></marker></defs>
<rect width="1280" height="1000" fill="white"/>
<text x="42" y="47" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#152d46" text-anchor="start" font-weight="600">05 / Перекрытие DMA и вычислений</text>
<text x="42" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#536477" text-anchor="start">Идеальная шкала для полных tiles: 128-bit RAM, 8 images, 4 outputs, 64 inputs.</text>
<rect x="42" y="125" width="610" height="185" rx="10" fill="#eef5fc" stroke="#7d94aa" stroke-width="1.6"/>
<text x="347.0" y="186.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#152d46" text-anchor="middle">Input tile: 8 × 64 × 4 B = 2048 B</text>
<text x="347.0" y="211.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#152d46" text-anchor="middle">Weight tile: 4 × 64 × 4 B = 1024 B</text>
<text x="347.0" y="236.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#152d46" text-anchor="middle">RAM interface: 128 bit/cycle = 16 B/cycle</text>
<text x="347.0" y="261.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#152d46" text-anchor="middle">DMA: 3072 / 16 = 192 cycles</text>
<rect x="685" y="125" width="553" height="185" rx="10" fill="#e4f3ee" stroke="#7d94aa" stroke-width="1.6"/>
<text x="961.5" y="198.5" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#152d46" text-anchor="middle">Compute: 8 × 4 × 64 = 2048 MAC</text>
<text x="961.5" y="223.5" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#152d46" text-anchor="middle">4 PE × 4 MAC = 16 MAC/cycle</text>
<text x="961.5" y="248.5" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#152d46" text-anchor="middle">2048 / 16 MAC/cycle = 128 cycles</text>
<polyline points="225.0,370 225.0,580" fill="none" stroke="#42566d" stroke-width="2" stroke-dasharray="7 5"/>
<text x="225.0" y="350" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#152d46" text-anchor="middle">0</text>
<polyline points="465.0,370 465.0,580" fill="none" stroke="#42566d" stroke-width="2" stroke-dasharray="7 5"/>
<text x="465.0" y="350" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#152d46" text-anchor="middle">192</text>
<polyline points="705.0,370 705.0,580" fill="none" stroke="#42566d" stroke-width="2" stroke-dasharray="7 5"/>
<text x="705.0" y="350" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#152d46" text-anchor="middle">384</text>
<polyline points="945.0,370 945.0,580" fill="none" stroke="#42566d" stroke-width="2" stroke-dasharray="7 5"/>
<text x="945.0" y="350" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#152d46" text-anchor="middle">576</text>
<polyline points="1185.0,370 1185.0,580" fill="none" stroke="#42566d" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1185.0" y="350" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#152d46" text-anchor="middle">768</text>
<text x="50" y="433" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#152d46" text-anchor="start" font-weight="600">DMA</text>
<text x="50" y="538" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#152d46" text-anchor="start" font-weight="600">MAC</text>
<rect x="225.0" y="390" width="236.0" height="72" rx="10" fill="#eef5fc" stroke="#7d94aa" stroke-width="1.6"/>
