<text x="219.5" y="336.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">1024 байта</text>
<rect x="475" y="260" width="763" height="90" rx="10" fill="#eef5fc" stroke="#7d94aa" stroke-width="1.6"/>
<text x="856.5" y="298.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#152d46" text-anchor="middle">Weight SRAM A/B · 512 байт</text>
<text x="856.5" y="323.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#152d46" text-anchor="middle">4 независимых банка: bank = lane; addr = local_k</text>
