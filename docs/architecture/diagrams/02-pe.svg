<text x="235" y="390" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#152d46" text-anchor="middle">8 × 16 входов — только часть K</text>
<text x="235" y="414" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#152d46" text-anchor="middle">текущего microbatch</text>
<text x="240" y="470" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#152d46" text-anchor="middle">одно x[m,t]</text>
<text x="240" y="502" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">broadcast на 4 MAC</text>
<text x="220" y="647" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">4 веса удерживаются</text>
<text x="220" y="676" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">при смене m</text>
<text x="220" y="785" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">ACC не выгружаются</text>
<text x="220" y="814" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">между K-tiles</text>
<rect x="42" y="880" width="1196" height="78" rx="10" fill="#f5f7fa" stroke="#7d94aa" stroke-width="1.6"/>
<text x="640.0" y="912.5" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">ACC: частичные суммы для 8 изображений × 4 выходов.</text>
<text x="640.0" y="937.5" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">После всех K-tiles: ACC[m,lane] → общая редукция четырёх PE.</text>
<text x="42" y="979" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#687a8b" text-anchor="start">mlp-accelerator-sim · Архитектура · Базовая конфигурация: 4 PE</text>
