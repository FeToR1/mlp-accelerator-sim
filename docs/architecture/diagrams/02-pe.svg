<text x="42" y="47" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#152d46" text-anchor="start" font-weight="600">02 / Микроархитектура одного PE для microbatch из 8 изображений</text>
<text x="42" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#536477" text-anchor="start">local tile: 8 images × 4 outputs × 16 local inputs. PE = k mod 4.</text>
<rect x="42" y="125" width="440" height="70" rx="10" fill="#fff3dc" stroke="#7d94aa" stroke-width="1.6"/>
<text x="262.0" y="153.5" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">Tile controller: t, m, маски</text>
<text x="262.0" y="178.5" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">готовность A/B · valid/ready</text>
<rect x="590" y="125" width="648" height="70" rx="10" fill="#eef5fc" stroke="#7d94aa" stroke-width="1.6"/>
<text x="914.0" y="153.5" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">DMA пишет свободный буфер; PE читает готовый</text>
<text x="914.0" y="178.5" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#152d46" text-anchor="middle">Перезапись разрешена только после COMPUTE_DONE</text>
